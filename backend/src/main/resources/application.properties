# Application Name
spring.application.name=browser-file-system

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/browser_file_system
spring.data.mongodb.auto-index-creation=false

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.root=INFO
logging.level.com.browserfilesystem=DEBUG